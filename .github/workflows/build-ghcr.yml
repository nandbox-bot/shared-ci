name: Shared CI + Bidirectional Sync

on:
  workflow_call:
    secrets:
      ORG_PAT:
        required: true
      WEBHOOK_URL:
        required: true

permissions:
  contents: write
  packages: write

jobs:       
  sync:
    # Only run if not triggered by sync-bot commit (safe for workflow_call)
    if: ${{ github.event.head_commit && !contains(github.event.head_commit.message, '[sync-bot]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitHub CLI authentication
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          echo "Authenticating gh CLI..."
          gh auth status || echo "GH CLI ready"

      - name: Determine counterpart repository
        id: repo
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"

          if [[ "$REPO_NAME" == *"-public" ]]; then
              TARGET_REPO="${REPO_NAME%-public}"
              TARGET_VISIBILITY="private"
          else
              TARGET_REPO="${REPO_NAME}-public"
              TARGET_VISIBILITY="public"
          fi

          echo "repo_owner=$REPO_OWNER" >> $GITHUB_OUTPUT
          echo "target_repo=$TARGET_REPO" >> $GITHUB_OUTPUT
          echo "target_visibility=$TARGET_VISIBILITY" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config --global user.name "sync-bot"
          git config --global user.email "sync-bot@users.noreply.github.com"

      - name: Check if counterpart repo exists
        run: |
          if gh repo view "${{ steps.repo.outputs.repo_owner }}/${{ steps.repo.outputs.target_repo }}" > /dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create counterpart repo if missing
        if: env.EXISTS == 'false'
        run: |
          echo "Creating repo ${{ steps.repo.outputs.target_repo }} with visibility ${{ steps.repo.outputs.target_visibility }}"
          gh repo create \
            "${{ steps.repo.outputs.repo_owner }}/${{ steps.repo.outputs.target_repo }}" \
            --${{ steps.repo.outputs.target_visibility }} \
            --confirm

      - name: Clone counterpart repo
        run: |
          git clone \
            https://x-access-token:${{ secrets.ORG_PAT }}@github.com/${{ steps.repo.outputs.repo_owner }}/${{ steps.repo.outputs.target_repo }}.git \
            .counterpart || (echo "Empty repo, initializing..." && mkdir .counterpart && cd .counterpart && git init && git checkout -b main)

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ .counterpart/

      - name: Commit synced changes
        run: |
          cd .counterpart
          git add .

          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "[sync-bot] mirror sync from ${GITHUB_REPOSITORY}"
          fi

      - name: Ensure main branch exists
        run: |
          cd .counterpart
          git branch -M main || echo "Branch 'main' already exists"

      - name: Push synced changes
        run: |
          cd .counterpart
          git push origin main --force
