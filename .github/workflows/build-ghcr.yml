name: Shared CI + Bidirectional Sync

on:
  workflow_call:
    secrets:
      ORG_PAT:
        required: true

permissions:
  contents: write
  packages: write

jobs:
  docker:
    if: "!endsWith(github.repository, '-public')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: |
          echo "REPO_OWNER_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout shared CI repo
        uses: actions/checkout@v4
        with:
          repository: nandbox-bot/shared-ci
          path: shared-ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: shared-ci/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER_LOWER }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Prevent infinite sync loops
        if: contains(github.event.head_commit.message, '[sync-bot]')
        run: |
          echo "Bot commit detected. Skipping sync."
          exit 0

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine counterpart repository
        id: repo
        run: |
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")
          REPO_OWNER=$(dirname "${GITHUB_REPOSITORY}")

          if [[ "$REPO_NAME" == *"-public" ]]; then
              TARGET_REPO="${REPO_NAME%-public}"
              TARGET_VISIBILITY="private"
          else
              TARGET_REPO="${REPO_NAME}-public"
              TARGET_VISIBILITY="public"
          fi

          echo "repo_owner=$REPO_OWNER" >> $GITHUB_OUTPUT
          echo "target_repo=$TARGET_REPO" >> $GITHUB_OUTPUT
          echo "target_visibility=$TARGET_VISIBILITY" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config --global user.name "sync-bot"
          git config --global user.email "sync-bot@users.noreply.github.com"

      - name: Check if counterpart repo exists
        id: check_repo
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          if gh repo view "${{ steps.repo.outputs.repo_owner }}/${{ steps.repo.outputs.target_repo }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create counterpart repo if missing
        if: steps.check_repo.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          gh repo create \
            "${{ steps.repo.outputs.repo_owner }}/${{ steps.repo.outputs.target_repo }}" \
            --${{ steps.repo.outputs.target_visibility }}

      - name: Clone counterpart repo
        run: |
          git clone \
            https://x-access-token:${{ secrets.ORG_PAT }}@github.com/${{ steps.repo.outputs.repo_owner }}/${{ steps.repo.outputs.target_repo }}.git \
            counterpart

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            ./ counterpart/

      - name: Commit synced changes
        run: |
          cd counterpart

          git add .

          git commit -m "[sync-bot] mirror sync from ${GITHUB_REPOSITORY}" \
          || echo "No changes to commit"

      - name: Push synced changes
        run: |
          cd counterpart

          git push origin main
